<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾光校园｜校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/home.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="page-scroll">
      <section id="home-view">
        <header class="hero">
          <div class="hero-copy">
            <h1>在校园里走散的小物，<br><span>总会找到回家的路。</span></h1>
          </div>
          <span class="hero-emblem">
            <img src="assets/campus-emblem.png" alt="福州大学校徽">
          </span>
        </header>

        <main class="content">
          <div class="home-shortcuts" aria-label="快捷浏览">
            <button class="shortcut-card" data-home-type="found" type="button">
              <span class="shortcut-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search">
                  <path d="m21 21-4.34-4.34"/>
                  <circle cx="11" cy="11" r="8"/>
                </svg>
              </span>
              <span class="shortcut-copy">
                <strong>查看招领信息</strong>
              </span>
            </button>

            <button class="shortcut-card" data-home-type="lost" type="button">
              <span class="shortcut-icon shortcut-icon-orange" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package-search">
                  <path d="M12 22V12"/>
                  <path d="M20.27 18.27 22 20"/>
                  <path d="M21 10.498V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l.98-.559"/>
                  <path d="M3.29 7 12 12l8.71-5"/>
                  <path d="m7.5 4.27 8.997 5.148"/>
                  <circle cx="18.5" cy="16.5" r="2.5"/>
                </svg>
              </span>
              <span class="shortcut-copy">
                <strong>查看寻物信息</strong>
              </span>
            </button>
          </div>

          <section id="home-news" class="home-news">
            <div class="section-heading">
              <h2>最新发布</h2>
            </div>

            <div id="item-list" class="item-list"></div>
            <p class="page-note">
              初始卡片为演示信息。校徽仅作校园主题展示，不代表官方认证。
            </p>
          </section>
        </main>
      </section>

      <section id="search-view" hidden>
        <main class="content search-content">
          <header class="search-intro">
            <h1>搜索失物招领</h1>
            <p>输入物品名称、特征或地点，快速找到相关信息。</p>
          </header>

          <form id="search-form" class="search-panel">
            <label class="visually-hidden" for="search-input">搜索物品</label>
            <div class="search-row">
              <input id="search-input" type="search"
                     placeholder="搜索校园卡、雨伞、图书馆……">
              <button type="submit">搜索</button>
            </div>
            <div class="filter-row">
              <span class="filter-label visually-hidden">信息类型</span>
              <div class="type-filters" role="group" aria-label="信息类型筛选">
                <button type="button" class="is-active" data-type="all" aria-pressed="true">全部</button>
                <button type="button" data-type="found" aria-pressed="false">招领</button>
                <button type="button" data-type="lost" aria-pressed="false">寻物</button>
              </div>
            </div>
          </form>

          <div class="search-results-heading">
            <h2>搜索结果</h2>
            <p id="search-summary" class="search-summary" aria-live="polite"></p>
          </div>
          <div id="search-results" class="item-list"></div>
        </main>
      </section>
      <section id="publish-view" hidden>
        <main class="content publish-content">
          <button id="publish-back" class="detail-back" type="button">‹ 返回首页</button>
          <div class="section-heading"><h2>发布信息</h2></div>
          <form id="publish-form" class="publish-form" novalidate>
            <fieldset class="publish-type">
              <legend>你要发布什么？</legend>
              <div class="publish-types">
                <label><input type="radio" name="publish-type" value="lost" checked><span>我丢了 · 寻物</span></label>
                <label><input type="radio" name="publish-type" value="found"><span>我捡到 · 招领</span></label>
              </div>
            </fieldset>
            <div class="publish-fields">
              <div class="publish-field">
                <label for="publish-name">物品名称<span>*</span></label>
                <input id="publish-name" name="name" required maxlength="80" placeholder="如：黑色折叠伞" aria-describedby="error-name">
                <p id="error-name" class="field-error" hidden></p>
              </div>
              <div class="publish-field">
                <label for="publish-category">物品分类<span>*</span></label>
                <input id="publish-category" name="category" required maxlength="40" placeholder="如：生活用品、证件卡片" aria-describedby="error-category">
                <p id="error-category" class="field-error" hidden></p>
              </div>
              <div class="publish-field">
                <label for="publish-eventTime"><span id="publish-time-label">丢失时间</span><span>*</span></label>
                <input id="publish-eventTime" name="eventTime" required maxlength="80" placeholder="如：9月26日 下午三点" aria-describedby="error-eventTime">
                <p id="error-eventTime" class="field-error" hidden></p>
              </div>
              <div class="publish-field">
                <label for="publish-location"><span id="publish-location-label">丢失地点</span><span>*</span></label>
                <input id="publish-location" name="location" required maxlength="120" placeholder="如：第三教学楼 203" aria-describedby="error-location">
                <p id="error-location" class="field-error" hidden></p>
              </div>
              <div class="publish-field publish-wide">
                <label for="publish-description">外观特征<span>*</span></label>
                <textarea id="publish-description" name="description" required maxlength="1000" rows="3" placeholder="颜色、样式等可帮助核对的信息" aria-describedby="error-description"></textarea>
                <p id="error-description" class="field-error" hidden></p>
              </div>
              <div class="publish-field publish-wide">
                <label for="publish-contact">联系方式<span>*</span></label>
                <input id="publish-contact" name="contact" required maxlength="200" placeholder="如 QQ、邮箱或校内服务台" aria-describedby="error-contact">
                <p id="error-contact" class="field-error" hidden></p>
              </div>
            </div>
            <p class="publish-note">请勿公开校园卡完整号码、住址等敏感信息；联系与归还前先核对物品特征。</p>
            <p id="publish-error" class="field-error" role="alert" hidden></p>
            <button class="contact-button" type="submit">发布信息</button>
          </form>
        </main>
      </section>
      <section id="publish-success-view" hidden>
        <main class="content publish-content">
          <div class="section-heading"><h2>发布成功</h2></div>
          <div class="publish-success" role="status">
            <span class="success-mark" aria-hidden="true">✓</span>
            <h2>发布成功</h2>
            <p id="publish-success-message"></p>
          </div>
          <button id="success-mine" class="contact-button" type="button">查看我的发布</button>
          <button id="success-home" class="secondary-button" type="button">返回首页</button>
        </main>
      </section>
      <section id="mine-view" hidden>
        <main class="content">
          <button id="mine-back" class="detail-back" type="button">‹ 返回首页</button>
          <div class="section-heading"><h2>我的发布</h2></div>
          <div class="section-heading mine-heading">
            <h3>我发布的信息</h3>
            <span id="mine-count">0 条</span>
          </div>
          <p id="mine-feedback" class="mine-feedback" role="status" tabindex="-1" hidden></p>
          <div id="mine-list" class="item-list"></div>
        </main>
      </section>
      <section id="detail-view" hidden>
        <main class="content detail-content">
          <button id="detail-back" class="detail-back" type="button">
            ‹ 返回上一页
          </button>

          <header class="detail-header">
            <div class="detail-badges">
              <span id="detail-kind" class="detail-kind"></span>
              <span id="detail-status" class="detail-status"></span>
            </div>
            <h1 id="detail-title"></h1>
            <p id="detail-published" class="detail-published"></p>
          </header>

          <div class="detail-layout">
            <section class="detail-panel" aria-labelledby="detail-info-heading">
              <h2 id="detail-info-heading">物品信息</h2>
              <div id="detail-fields" class="detail-fields"></div>
            </section>

            <aside class="contact-panel">
              <h2>联系发布者</h2>
              <p>如果这件物品与你有关，请先核对特征或准备归属凭证，再约定交接方式。</p>
              <button id="reveal-contact" class="contact-button" type="button">
                查看联系方式
              </button>
              <p id="detail-contact" class="contact-text" hidden></p>
              <p class="contact-note">请在安全、方便的校园公共地点交接。</p>
            </aside>
          </div>
        </main>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <div class="nav-brand" aria-label="拾光校园">
        <span class="brand-mark">拾</span>
        <span class="brand-name">拾光校园</span>
      </div>
      <button id="home-nav" class="nav-item active" type="button" aria-current="page">
        <span class="nav-icon">⌂</span><span>首页</span>
      </button>
      <button id="search-nav" class="nav-item" type="button">
        <span class="nav-icon">⌕</span><span>搜索</span>
      </button>
      <button id="publish-nav" class="nav-item" type="button">
        <span class="nav-icon">＋</span><span>发布</span>
      </button>
      <button id="mine-nav" class="nav-item" type="button">
        <span class="nav-icon">○</span><span>我的</span>
      </button>
    </nav>
  </div>

</body>
</html>
