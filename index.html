<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾光校园｜校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/utils.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/card.js" defer></script>
  <script src="js/home.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/publish.js" defer></script>
  <script src="js/similar.js" defer></script>
  <script src="js/detail.js" defer></script>
  <script src="js/mine.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="page-scroll">
      <section id="home-view">
        <header class="hero">
          <div class="hero-copy">
            <h1>在校园里走散的小物，<br><span>总会找到回家的路。</span></h1>
          </div>
          <span class="hero-emblem">
            <img src="assets/campus-emblem.png" alt="福州大学校徽">
          </span>
        </header>

        <main class="content">
          <div class="home-shortcuts" aria-label="快捷浏览">
            <button class="shortcut-card" data-publish-type="lost" type="button">
              <span class="shortcut-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search">
                  <path d="m21 21-4.34-4.34"/>
                  <circle cx="11" cy="11" r="8"/>
                </svg>
              </span>
              <span class="shortcut-copy">
                <strong>我丢了东西</strong>
              </span>
            </button>

            <button class="shortcut-card" data-publish-type="found" type="button">
              <span class="shortcut-icon shortcut-icon-orange" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-package-search">
                  <path d="M12 22V12"/>
                  <path d="M20.27 18.27 22 20"/>
                  <path d="M21 10.498V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.729l7 4a2 2 0 0 0 2 .001l.98-.559"/>
                  <path d="M3.29 7 12 12l8.71-5"/>
                  <path d="m7.5 4.27 8.997 5.148"/>
                  <circle cx="18.5" cy="16.5" r="2.5"/>
                </svg>
              </span>
              <span class="shortcut-copy">
                <strong>我捡到东西</strong>
              </span>
            </button>
          </div>

          <section id="home-news" class="home-news">
            <div class="section-heading">
              <h2>最新发布</h2>
              <button id="home-view-all" class="view-all-button" type="button">查看全部 →</button>
            </div>

            <div id="item-list" class="item-list"></div>
            <p class="page-note">
              初始卡片为演示信息。校徽仅作校园主题展示，不代表官方认证。
            </p>
          </section>
        </main>
      </section>

      <section id="search-view" hidden>
        <main class="content search-content">
          <button id="search-back" class="detail-back" type="button">‹ 返回首页</button>
          <header class="search-intro">
            <h1>搜索失物招领</h1>
          </header>

          <form id="search-form" class="search-panel">
            <label class="visually-hidden" for="search-input">搜索物品</label>
            <div class="search-row">
              <div class="search-input-wrap">
              <input id="search-input" type="search"
                     autocomplete="off" aria-controls="search-history" aria-expanded="false" placeholder="搜索校园卡、雨伞、图书馆……">
            <section id="search-history" class="search-history" aria-label="搜索历史" hidden>
              <div class="search-history-heading"><h3>搜索历史</h3><button id="clear-search-history" type="button">清空记录</button></div>
              <div id="search-history-list" class="search-history-list"></div>
            </section>
              </div>
              <button type="submit">搜索</button>
            </div>
            <div class="filter-row">
              <span class="filter-label visually-hidden">信息类型</span>
              <div class="type-filters" role="group" aria-label="信息类型筛选">
                <button type="button" class="is-active" data-type="all" aria-pressed="true">全部</button>
                <button type="button" data-type="found" aria-pressed="false">招领</button>
                <button type="button" data-type="lost" aria-pressed="false">寻物</button>
              </div>
            </div>
            <div class="search-extra-filters">
              <div><label for="search-category">物品类别</label>
                <select id="search-category"><option value="">全部类别</option></select>
              </div>
              <div><label for="search-region">物品地点</label><select id="search-region">
                <option value="">全部地点</option><option value="teaching">教学区（含实验楼）</option><option value="library">图书馆</option><option value="canteen">食堂</option><option value="dorm">宿舍区</option><option value="sports">操场</option><option value="other">其他区域</option>
              </select></div>
              <div><label for="search-days">时间范围</label><select id="search-days">
                <option value="">不限时间</option><option value="7">最近7天</option><option value="30">最近30天</option><option value="custom">自定义日期</option>
              </select></div>
              <div><label for="search-sort">排序方式</label><select id="search-sort">
                <option value="default">默认排序</option><option value="published">发布时间</option><option value="views">浏览次数</option>
              </select></div>
            </div>
            <div id="search-date-range" class="search-date-range" hidden>
              <div><label for="search-start-date">开始日期</label><input id="search-start-date" type="date" aria-describedby="search-date-error"></div>
              <div><label for="search-end-date">结束日期</label><input id="search-end-date" type="date" aria-describedby="search-date-error"></div>
              <p id="search-date-error" class="field-error" role="alert" hidden></p>
            </div>
          </form>

          <div class="search-results-heading">
            <h2>搜索结果</h2>
            <p id="search-summary" class="search-summary" aria-live="polite"></p>
          </div>
          <div id="search-results" class="item-list"></div>
        </main>
      </section>
      <section id="publish-view" hidden>
        <main class="content publish-content">
          <button id="publish-back" class="detail-back" type="button">‹ 返回首页</button>
          <header class="publish-intro"><h2 id="publish-heading">发布信息</h2></header>
          <form id="publish-form" class="publish-form" novalidate>
            <fieldset class="publish-type">
              <legend>发布类型</legend>
              <div class="publish-types">
                <label><input type="radio" name="publish-type" value="lost" checked><span>寻物启事</span></label>
                <label><input type="radio" name="publish-type" value="found"><span>失物招领</span></label>
              </div>
            </fieldset>
            <section id="similar-panel" class="similar-panel" aria-label="相似信息提醒" hidden>
              <h3>可能相关的信息</h3>
              <div id="similar-list" class="similar-list"></div>
            </section>
            <div class="publish-fields">
              <h3 class="publish-group-heading">物品信息</h3>
              <div class="publish-field">
                <label for="publish-name">物品名称<span>*</span></label>
                <input id="publish-name" name="name" required maxlength="80" placeholder="如：黑色折叠伞" aria-describedby="error-name">
                <p id="error-name" class="field-error" hidden></p>
              </div>
              <div class="publish-field">
                <label for="publish-category">物品分类<span>*</span></label>
                <select id="publish-category" name="category" required aria-describedby="error-category">
                  <option value="">请选择物品分类</option>
                </select>
                <p id="error-category" class="field-error" hidden></p>
              </div>
              <div class="publish-field">
                <label for="publish-eventTime"><span id="publish-time-label">丢失时间</span><span>*</span></label>
                <input id="publish-eventTime" name="eventTime" type="datetime-local" required step="60" aria-describedby="error-eventTime">
                <p id="error-eventTime" class="field-error" hidden></p>
              </div>
              <div class="publish-field">
                <label for="publish-region">所在区域<span>*</span></label>
                <select id="publish-region" name="region" required aria-describedby="error-region">
                  <option value="">请选择所在区域</option><option value="teaching">教学区（含实验楼）</option><option value="library">图书馆</option><option value="canteen">食堂</option><option value="dorm">宿舍区</option><option value="sports">操场</option><option value="other">其他区域</option>
                </select>
                <p id="error-region" class="field-error" hidden></p>
              </div>
              <div class="publish-field publish-wide">
                <label for="publish-location"><span id="publish-location-label">丢失地点</span><span>*</span></label>
                <input id="publish-location" name="location" required maxlength="120" placeholder="如：第三教学楼 203" aria-describedby="error-location">
                <p id="error-location" class="field-error" hidden></p>
              </div>
              <div class="publish-field publish-wide">
                <label for="publish-description">外观特征<span>*</span></label>
                <textarea id="publish-description" name="description" required maxlength="1000" rows="3" placeholder="颜色、样式等可帮助核对的信息" aria-describedby="error-description"></textarea>
                <p id="error-description" class="field-error" hidden></p>
              </div>
              <div class="publish-field publish-wide">
                <label for="publish-images">物品照片（选填，最多3张）</label>
                <div id="photo-previews" class="photo-previews"></div>
                <label class="photo-upload" for="publish-images">＋ 添加照片</label>
                <input id="publish-images" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" multiple>
                <p id="photo-feedback" class="field-error" role="status" hidden></p>
              </div>
              <h3 class="publish-group-heading contact-group-heading">联系信息</h3>
              <div class="publish-field">
                <label for="publish-contactMethod">联系渠道<span>*</span></label>
                <select id="publish-contactMethod" name="contactMethod" required aria-describedby="error-contactMethod">
                  <option value="">请选择联系渠道</option><option>QQ</option><option>微信</option><option>电话</option><option>邮箱</option><option>其他</option>
                </select>
                <p id="error-contactMethod" class="field-error" hidden></p>
              </div>
              <div class="publish-field">
                <label for="publish-contact">联系方式<span>*</span></label>
                <input id="publish-contact" name="contact" required maxlength="200" placeholder="如 QQ、邮箱或校内服务台" aria-describedby="error-contact">
                <p id="error-contact" class="field-error" hidden></p>
              </div>
            </div>
            <p id="publish-error" class="field-error" role="alert" hidden></p>
            <div class="publish-footer">
              <p class="publish-note">联系方式将公开，请勿填写完整证件号码或住址。</p>
              <div class="publish-actions">
                <button id="clear-publish-draft" class="secondary-button" type="button">清除草稿</button>
                <button id="edit-cancel" class="secondary-button" type="button" hidden>取消修改</button>
                <button id="publish-submit" class="contact-button" type="submit">发布信息</button>
              </div>
            </div>
          </form>
        </main>
      </section>
      <section id="publish-success-view" hidden>
        <main class="content publish-content">
          <div class="publish-success" role="status">
            <span class="success-mark" aria-hidden="true">✓</span>
            <h2>发布成功</h2>
            <p id="publish-success-message"></p>
          </div>
          <button id="success-mine" class="contact-button" type="button">查看我的发布</button>
          <button id="success-home" class="secondary-button" type="button">返回首页</button>
        </main>
      </section>
      <section id="mine-view" hidden>
        <main class="content">
          <button id="mine-back" class="detail-back" type="button">‹ 返回首页</button>
          <div class="section-heading"><h2>我的发布</h2></div>
          <div class="mine-filters" role="group" aria-label="发布状态筛选">
            <button type="button" class="is-active" data-mine-status="all" aria-pressed="true">全部 <span id="mine-all-count">0</span></button>
            <button type="button" data-mine-status="active" aria-pressed="false">处理中 <span id="mine-active-count">0</span></button>
            <button type="button" data-mine-status="resolved" aria-pressed="false">已完成 <span id="mine-resolved-count">0</span></button>
          </div>
          <div class="section-heading mine-heading">
            <h3>我发布的信息</h3>
            <span id="mine-count" aria-live="polite">0 条</span>
          </div>
          <p id="mine-feedback" class="mine-feedback" role="status" tabindex="-1" hidden></p>
          <div id="mine-list" class="item-list"></div>
        </main>
      </section>
      <section id="detail-view" hidden>
        <main class="content detail-content">
          <button id="detail-back" class="detail-back" type="button">
            ‹ 返回上一页
          </button>

          <div class="detail-layout">
          <section class="detail-panel" aria-labelledby="detail-title">
          <header class="detail-header">
            <div class="detail-badges">
              <span id="detail-kind" class="detail-kind"></span>
              <span id="detail-status" class="detail-status"></span>
              <span id="detail-category" class="detail-category"></span>
            </div>
            <h1 id="detail-title"></h1>
            <p id="detail-published" class="detail-published"></p>
          </header>

              <div id="detail-photos" class="detail-photos" hidden></div>
              <div class="detail-description">
                <h2>外观特征</h2>
                <p id="detail-description"></p>
              </div>
              <div id="detail-fields" class="detail-fields"></div>
            </section>

            <aside class="contact-panel">
              <h2>联系方式</h2>
              <p id="detail-contact" class="contact-text"></p>
              <button id="copy-contact" class="contact-button" type="button">
                复制联系方式
              </button>
              <p id="copy-contact-feedback" class="copy-feedback" role="status" aria-live="polite" hidden></p>
            </aside>
          </div>
        </main>
      </section>
    </div>

    <dialog id="photo-dialog" class="photo-dialog" aria-label="查看物品照片">
      <button id="photo-close" type="button" class="secondary-button">关闭</button>
      <img id="photo-full" alt="物品照片">
    </dialog>
    <nav class="bottom-nav" aria-label="主导航">
      <div class="nav-brand" aria-label="拾光校园">
        <span class="brand-mark">拾</span>
        <span class="brand-name">拾光校园</span>
      </div>
      <button id="home-nav" class="nav-item active" type="button" aria-current="page">
        <span class="nav-icon">⌂</span><span>首页</span>
      </button>
      <button id="search-nav" class="nav-item" type="button">
        <span class="nav-icon">⌕</span><span>搜索</span>
      </button>
      <button id="publish-nav" class="nav-item" type="button">
        <span class="nav-icon">＋</span><span>发布</span>
      </button>
      <button id="mine-nav" class="nav-item" type="button">
        <span class="nav-icon">○</span><span>我的</span>
      </button>
    </nav>
  </div>

</body>
</html>
